<!DOCTYPE html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <title>Career Xone - Smart Portal</title>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Career Xone - Coaching Institute Student Management, Biometric Attendance, Test Results & Parents Portal" />
    <meta name="theme-color" content="#0284c7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Career Xone" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="icon" type="image/png" href="./logo-192.png" />
    
    <link id="app-manifest" rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-title" content="Career Xone" />

    <script>
      function updatePWAManifest() {
        const path = (window.location.pathname || '').toLowerCase();
        const hash = (window.location.hash || '').toLowerCase();
        const search = (window.location.search || '').toLowerCase();
        const isElectron = navigator.userAgent.toLowerCase().indexOf(' electron/') > -1;

        let appParam = 'parent';
        let appTitle = isElectron ? 'Career Xone Pro' : 'Career Xone - Smart Portal';
        let appleTitle = 'Career Xone';

        if (path.includes('/teacher') || hash.includes('/teacher') || search.includes('app=teacher')) {
          appParam = 'teacher';
          appTitle = 'CX Teacher';
          appleTitle = 'CX Teacher';
        } else if (path.includes('/staff') || hash.includes('/staff') || search.includes('app=staff')) {
          appParam = 'staff';
          appTitle = 'CX Staff';
          appleTitle = 'CX Staff';
        } else if (path.includes('/inquiry') || hash.includes('/inquiry') || search.includes('app=inquiry')) {
          appParam = 'inquiry';
          appTitle = 'CX Inquiry';
          appleTitle = 'CX Inquiry';
        } else if (path.includes('/parent') || hash.includes('/parent') || search.includes('app=parent')) {
          appParam = 'parent';
          appTitle = 'CX Parents';
          appleTitle = 'CX Parents';
        } else if (isElectron) {
          appTitle = 'Career Xone Pro';
        }

        document.title = appTitle;
        const appleTitleMeta = document.querySelector('meta[name="apple-mobile-web-app-title"]');
        if (appleTitleMeta) appleTitleMeta.setAttribute('content', appleTitle);

        const manifestEl = document.getElementById('app-manifest');
        if (manifestEl) {
          const targetHref = '/manifest-' + appParam + '.json';
          if (manifestEl.getAttribute('href') !== targetHref) {
            manifestEl.setAttribute('href', targetHref);
          }
        }
      }

      // Initial execution safely without document.write
      updatePWAManifest();
      window.addEventListener('hashchange', updatePWAManifest);
      window.addEventListener('popstate', updatePWAManifest);

      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready', { detail: e }));
        console.log('[PWA] beforeinstallprompt captured early in HEAD!');
      });

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js', { scope: '/' }).then((reg) => {
          console.log('[PWA] ServiceWorker registered with scope:', reg.scope);
        }).catch((err) => {
          console.warn('[PWA] ServiceWorker registration error:', err);
        });
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="./assets/index-BoxJq0mi.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-D58_1uDB.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
