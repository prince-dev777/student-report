<!DOCTYPE html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <title>Career Xone - Smart Portal</title>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Career Xone - Coaching Institute Student Management, Biometric Attendance, Test Results & Parents Portal" />
    <meta name="theme-color" content="#0284c7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Career Xone" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="icon" type="image/png" href="/logo-192.png" />
    
    <link id="app-manifest" rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-title" content="Career Xone" />

    <!-- 🛡️ Heavy Anti-Bot & Selenium Shield: Blocks automated scrapers and headless browser drivers -->
    <script>
      (function() {
        try {
          var isBot = navigator.webdriver || 
                      window.document.documentElement.getAttribute("webdriver") || 
                      window.callPhantom || 
                      window._phantom || 
                      window.__nightmare;
          var isGoogle = /googlebot/i.test(navigator.userAgent);
          if (isBot && !isGoogle) {
            window.stop && window.stop();
            document.documentElement.innerHTML = '<div style="background:#090d16;color:#f87171;padding:60px 20px;font-family:system-ui,sans-serif;text-align:center;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;">' +
              '<h1 style="font-size:2rem;margin-bottom:12px;color:#ef4444;">🛡️ Access Denied</h1>' +
              '<p style="color:#94a3b8;max-width:500px;line-height:1.6;">Automated browsing tools, scrapers, and headless browser drivers (Selenium, Puppeteer) are strictly prohibited on this network.</p>' +
            '</div>';
            throw new Error("Automated scraper blocked by Career Xone Bot Shield");
          }
        } catch(e) {}
      })();
    </script>

    <script>
      function updatePWAManifest() {
        const path = (window.location.pathname || '').toLowerCase();
        const hash = (window.location.hash || '').toLowerCase();
        const search = (window.location.search || '').toLowerCase();
        const isElectron = navigator.userAgent.toLowerCase().indexOf(' electron/') > -1;

        let appParam = 'parent';
        let appTitle = isElectron ? 'Career Xone Pro' : 'Career Xone - Smart Portal';
        let appleTitle = 'Career Xone';

        if (path.includes('/teacher') || hash.includes('/teacher') || search.includes('app=teacher')) {
          appParam = 'teacher';
          appTitle = 'CX Teacher';
          appleTitle = 'CX Teacher';
        } else if (path.includes('/staff') || hash.includes('/staff') || search.includes('app=staff')) {
          appParam = 'staff';
          appTitle = 'CX Staff';
          appleTitle = 'CX Staff';
        } else if (path.includes('/inquiry') || hash.includes('/inquiry') || search.includes('app=inquiry')) {
          appParam = 'inquiry';
          appTitle = 'CX Inquiry';
          appleTitle = 'CX Inquiry';
        } else if (path.includes('/parent') || hash.includes('/parent') || search.includes('app=parent')) {
          appParam = 'parent';
          appTitle = 'CX Parents';
          appleTitle = 'CX Parents';
        } else if (isElectron) {
          appTitle = 'Career Xone Pro';
        }

        document.title = appTitle;
        const appleTitleMeta = document.querySelector('meta[name="apple-mobile-web-app-title"]');
        if (appleTitleMeta) appleTitleMeta.setAttribute('content', appleTitle);

        const manifestEl = document.getElementById('app-manifest');
        if (manifestEl) {
          const targetHref = '/manifest-' + appParam + '.json';
          if (manifestEl.getAttribute('href') !== targetHref) {
            manifestEl.setAttribute('href', targetHref);
          }
        }
      }

      // Initial execution safely without document.write
      updatePWAManifest();
      window.addEventListener('hashchange', updatePWAManifest);
      window.addEventListener('popstate', updatePWAManifest);

      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready', { detail: e }));
        console.log('[PWA] beforeinstallprompt captured early in HEAD!');
      });

      if ('serviceWorker' in navigator) {
        if (!isElectron) {
          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
              refreshing = true;
              console.log('[PWA] New version activated, auto-refreshing page for instant live updates...');
              window.location.reload();
            }
          });

          navigator.serviceWorker.register('/sw.js', { scope: '/' }).then((reg) => {
            console.log('[PWA] ServiceWorker registered with scope:', reg.scope);
            try { reg.update(); } catch (e) {}
            // Periodically check for code updates every 60 seconds
            setInterval(() => {
              try { reg.update(); } catch (e) {}
            }, 60000);
          }).catch((err) => {
            console.warn('[PWA] ServiceWorker registration error:', err);
          });
        } else {
          // Inside Electron: unregister any legacy service workers and clear cache storage
          navigator.serviceWorker.getRegistrations().then((regs) => {
            for (const reg of regs) {
              reg.unregister();
              console.log('[Desktop] Unregistered lingering ServiceWorker');
            }
          }).catch(() => {});
          if ('caches' in window) {
            caches.keys().then((names) => {
              names.forEach((name) => caches.delete(name));
            }).catch(() => {});
          }
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800&family=Montserrat:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800&family=Montserrat:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800&family=Montserrat:wght@400;500;600;700;800&display=swap">
    </noscript>
  </head>
  <body>
    <div id="root">
      <div id="app-preloader" style="
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(circle at 50% 35%, #1e293b 0%, #090d16 85%); color: #f8fafc; font-family: 'Outfit', 'Inter', system-ui, sans-serif;
        z-index: 999999; user-select: none;
      ">
        <div style="position: relative; margin-bottom: 26px; display: flex; align-items: center; justify-content: center;">
          <div style="
            position: absolute; width: 100px; height: 100px; border-radius: 28px;
            background: linear-gradient(135deg, rgba(2, 132, 199, 0.5), rgba(99, 102, 241, 0.5));
            filter: blur(20px); animation: cxGlowPulse 2.2s ease-in-out infinite;
          "></div>
          <div style="
            width: 84px; height: 84px; border-radius: 24px; background: linear-gradient(135deg, #0284c7 0%, #2563eb 50%, #6366f1 100%);
            display: flex; align-items: center; justify-content: center; font-size: 38px; font-weight: 900; color: #ffffff;
            box-shadow: 0 16px 36px -4px rgba(2, 132, 199, 0.55), inset 0 1px 1px rgba(255, 255, 255, 0.45);
            position: relative; letter-spacing: -1px; animation: cxLogoFloat 2.6s ease-in-out infinite;
          ">CX</div>
        </div>
        <div style="font-size: 1.45rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 8px; color: #ffffff;">Career Xone Pro</div>
        <div style="font-size: 0.88rem; color: #94a3b8; margin-bottom: 26px; display: flex; align-items: center; gap: 8px; font-weight: 500;">
          <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #10b981; box-shadow: 0 0 10px #10b981; animation: cxStatusBlink 1.4s infinite;"></span>
          <span>Starting intelligent workspace & local database...</span>
        </div>
        <div style="
          width: 240px; height: 5px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden; position: relative; box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
        ">
          <div style="
            position: absolute; height: 100%; width: 38%; background: linear-gradient(90deg, #0284c7, #38bdf8, #818cf8);
            border-radius: 999px; animation: cxBarSlide 1.3s ease-in-out infinite;
          "></div>
        </div>
        <div style="font-size: 0.72rem; color: #64748b; margin-top: 16px; letter-spacing: 0.04em; text-transform: uppercase; font-weight: 600;">
          Hardware push listeners & local server active
        </div>
        <style>
          @keyframes cxLogoFloat { 0%, 100% { transform: translateY(0px) scale(1); } 50% { transform: translateY(-4px) scale(1.02); } }
          @keyframes cxGlowPulse { 0%, 100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 0.95; transform: scale(1.15); } }
          @keyframes cxBarSlide { 0% { left: -38%; } 100% { left: 100%; } }
          @keyframes cxStatusBlink { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.85); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
